name: Build profile README

on:
  push:
    paths:
      - profile.json
      - build.py
  schedule:
    - cron: "7 7 * * *"   # daily at 07:07 UTC: refresh banner art
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python3 build.py
      - name: Commit generated files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A README.md assets
          git diff --cached --quiet || git commit -m "Rebuild profile (banner seed $(date -u +%F))"
          git push
